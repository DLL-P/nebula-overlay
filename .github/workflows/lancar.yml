# A cada commit no main (seu ou de uma contribuição aceita): roda os testes, gera o app e o instalador
# e publica uma versão no GitHub. O Nebula Overlay instalado acha essa versão e se atualiza sozinho.
# No ramo beta a versão sai como pré-lançamento: só quem marcou "Receber versões de teste" recebe.
name: Lançar versão

on:
  push:
    branches: [main, beta]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lancar
  cancel-in-progress: false

jobs:
  lancar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: python -m pip install pyinstaller==6.22.2

      - name: Testes
        run: python -X utf8 -m unittest discover -s testes

      - name: Número da versão
        id: v
        shell: bash
        run: echo "versao=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar app e instalador
        run: python -X utf8 empacotar/construir.py --versao ${{ steps.v.outputs.versao }}

      - name: Publicar a versão
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notas.txt
          if [ "${{ github.ref_name }}" = "beta" ]; then
            canal="--prerelease"; titulo="Nebula Overlay ${{ steps.v.outputs.versao }} (beta)"
          else
            canal="--latest"; titulo="Nebula Overlay ${{ steps.v.outputs.versao }}"
          fi
          gh release create "v${{ steps.v.outputs.versao }}" \
            dist/NebulaOverlay-Setup.exe dist/NebulaOverlay-Setup.exe.sha256 \
            --title "$titulo" --notes-file notas.txt $canal
