# Testes em cada pull request (contribuições): nada é publicado aqui.
name: Testes

on:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -X utf8 -m unittest discover -s testes
